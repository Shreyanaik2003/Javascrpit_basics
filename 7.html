    <script>
        //13... stone paper and scissor

        function playgame(playerchoice){
            const choices=['stone','paper','scissor']
            const computerChoice=choices[Math.floor(Math.random()*3)];

            console.log(`palyer :${playerchoice}`);
            console.log(`computer :${computerChoice}`);
            if(playerchoice==computerChoice){
            return "It's a Tie";
            }

            if((playerchoice=='stone' && computerChoice=='scissor')||(playerchoice=='paper' && computerChoice=='stone')||(playerchoice=='scissor' && computerChoice=='paper')){
                return "you win"
            }
            else{
                return "you lose"
            }
        }
        console.log(playgame("stone"));
        console.log(playgame("paper"));
        console.log(playgame("scissor"));

        //14.. remove characters
        
        let str="hello";
        //to replace one character
        str=str.replace("l","");
        console.log(str);

        //to remove all occurance
        str=str.replace(/l/g,"");
        console.log(str);

        //remove character at specific index
        function removeCharAt(str,index){
            return str.slice(0,index)+str.slice(index+1);
        }
        console.log(removeCharAt("hello",1));

        //remove all non alphabetic characters
        let str1="He110 W0r1d";
        str1=str1.replace(/[^a-zA-Z]/g,"");
        console.log(str1);

        //remove whitespace
        let str2="Hello world";
        str2=str2.replace(/\s/g,"");
        console.log(str2);

        //remove multiple specific characters
        let str3="apple banana";
        str3=str3.replace(/[aeo]/g,"");
        console.log(str3);

        //sum of positive numbers
        function sumOfPositive(arr){
            return arr.filter(num=>num>0).reduce((arr,curr)=>arr+curr,0);
            //return arr.reduce((acc,curr)=>curr>0?acc+curr:acc,0);
            //or using for loop
            //let sum=0;
            //for(let i=0;i<arr.length;i++){
            //    if(arr[i]>0){
            //        sum+=arr[i];
            //    } 
            //}
            //return sum;

        }
        console.log(sumOfPositive([1,-2,3,4,-5]));

        //String repeat
        let str4="Hello";
        let repeated=str4.repeat(4);
        console.log(repeated);

        function repeat(str5,n){
            repeat=''
            for(let i=0;i<n;i++){
                repeat=repeat+str5;
            }
            return repeat;
        }
        console.log(repeat("hello",3));


    </script>
